[project]
name = "ai-governance"
version = "0.1.0"
description = "AI policy-vs-practice checker: compares specs and ADRs against NIST AI RMF and the EU AI Act, with cited findings"
readme = "README.md"
authors = [
    { name = "Natalie Boehne", email = "30935329+njrboehne@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "pypdf>=6.21.1",
]

[project.scripts]
ai-governance = "ai_governance:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]


[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: pycodestyle errors + pyflakes, I: import sorting, B: bugbear, UP: pyupgrade
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: downloads the real source documents (run with -m network)"]
addopts = "-m 'not network'"
